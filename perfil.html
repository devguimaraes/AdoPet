<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Configure seu perfil na AdoPet para que ONGs e responsáveis possam conhecê-lo melhor.">
  <meta name="keywords" content="perfil, usuário, adoção, animais, pets, configuração">
  <meta name="author" content="Bruno Guimarães">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://adopet.com/perfil">
  <meta property="og:title" content="Meu Perfil - AdoPet">
  <meta property="og:description" content="Configure seu perfil na AdoPet para que ONGs e responsáveis possam conhecê-lo melhor.">
  <meta property="og:image" content="./assets/img/Logo-768.png">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://adopet.com/perfil">
  <meta property="twitter:title" content="Meu Perfil - AdoPet">
  <meta property="twitter:description" content="Configure seu perfil na AdoPet para que ONGs e responsáveis possam conhecê-lo melhor.">
  <meta property="twitter:image" content="./assets/img/Logo-768.png">
  
  <link rel="shortcut icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <title>Meu Perfil - AdoPet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize.css/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/index.css">
  <link rel="stylesheet" href="./assets/css/cadastro/cadastro.css">
  <link rel="stylesheet" href="./assets/css/homer/home.css">
  <link rel="stylesheet" href="./assets/css/mensagem/mensagem.css">
  <link rel="stylesheet" href="./assets/css/perfil/perfil.css">
</head>

<body>
  <header class="cabecalho cabecalho--mensagem" role="banner">
    <div class="background__top" aria-hidden="true"></div>
    
    <nav class="cabecalho__nav" role="navigation" aria-label="Navegação principal">
      <ul class="cabecalho__lista">
        <li class="cabecalho__item cabecalho__logo">
          <a href="index.html" class="cabecalho__link" aria-label="AdoPet - Página inicial">
            <img src="./assets/img/Logo-768.png" alt="Logo AdoPet" width="168" height="44">
          </a>
        </li>
        <li class="cabecalho__item">
          <a href="index.html" class="cabecalho__link" aria-label="Página inicial">
            <img src="./assets/img/icon-home.svg" alt="Ícone casa" width="24" height="24">
          </a>
        </li>
        <li class="cabecalho__item">
          <a href="mensagem.html" class="cabecalho__link" aria-label="Mensagens">
            <img src="./assets/img/icon-mail.svg" alt="Ícone mensagem" width="24" height="24">
          </a>
        </li>
      </ul>
    </nav>
    
    <a href="perfil.html" class="cabecalho__link" aria-label="Perfil do usuário">
      <div class="perfil__usuario perfil__usuario--novoUsario" role="img" aria-label="Avatar do usuário"></div>
    </a>
  </header>
  
  <div class="background__lateral" aria-hidden="true"></div>

  <main role="main">
    <section class="container__mensagem">
      <div class="profile-intro">
        <h1 class="home__paragrafo paragrafo__mensagem">
          Esse é o perfil que aparece para responsáveis ou ONGs que recebem sua mensagem.
        </h1>
      </div>

      <h2 class="formulario__titulo formulario__titulo--perfil">Perfil</h2>

      <div class="container__formulario">
        <form action="" class="formulario__mensagem" novalidate>
          <fieldset class="profile-photo-section">
            <legend class="formulario__titulo--mensagem">Foto</legend>
            
            <div class="container__avatar" role="button" tabindex="0" aria-label="Clique para alterar foto do perfil">
              <img src="./assets/img/avatar-usario-medio.svg" alt="Foto do perfil do usuário" width="80" height="80">
              <p class="avatar__paragrafo">Clique na foto para editar</p>
              <input type="file" id="foto" name="foto" accept="image/*" class="sr-only" aria-describedby="foto-help">
              <div id="foto-help" class="sr-only">Selecione uma imagem para seu perfil. Formatos aceitos: JPG, PNG, GIF</div>
            </div>
          </fieldset>

          <div class="form-group">
            <label for="nome" class="formulario__titulo--mensagem">Nome completo</label>
            <input 
              type="text" 
              id="nome" 
              name="nome" 
              class="input__mensagem" 
              placeholder="Digite seu nome completo"
              required
              aria-describedby="nome-error"
              autocomplete="name"
            >
            <div id="nome-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="telefone" class="formulario__titulo--mensagem">Telefone</label>
            <input 
              type="tel" 
              id="telefone" 
              name="telefone" 
              class="input__mensagem" 
              placeholder="(11) 99999-9999"
              pattern="^\(\d{2}\)\s\d{4,5}-\d{4}$"
              required
              aria-describedby="telefone-help telefone-error"
              autocomplete="tel"
            >
            <div id="telefone-help" class="input-help">Formato: (11) 99999-9999</div>
            <div id="telefone-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="cidade" class="formulario__titulo--mensagem">Cidade</label>
            <input 
              type="text" 
              id="cidade" 
              name="cidade" 
              class="input__mensagem" 
              placeholder="Digite sua cidade"
              required
              aria-describedby="cidade-error"
              autocomplete="address-level2"
            >
            <div id="cidade-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="sobre" class="formulario__titulo--mensagem">Sobre você</label>
            <textarea 
              name="sobre" 
              id="sobre" 
              class="textarea__mensagem" 
              placeholder="Conte um pouco sobre você, sua experiência com animais e por que deseja adotar"
              required
              aria-describedby="sobre-help sobre-error"
              maxlength="500"
            ></textarea>
            <div id="sobre-help" class="input-help">Máximo 500 caracteres. <span id="char-count">0/500</span></div>
            <div id="sobre-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <button type="submit" class="sessao__botao sessao__botao--cadastro sessao__botao--mensagem">
            SALVAR PERFIL
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer--cadastro" role="contentinfo">
    <p class="footer__paragrafo">
      © 2024 - Desenvolvido por 
      <a class="footer__link" href="https://github.com/devguimaraes" target="_blank" rel="noopener noreferrer" aria-label="Perfil do desenvolvedor Bruno Guimarães no GitHub (abre em nova aba)">
        Bruno Guimarães
      </a>
    </p>
  </footer>

  <script src="./assets/js/perfil.js"></script>
</body>

</html>
