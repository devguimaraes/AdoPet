<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se na AdoPet e comece sua jornada para encontrar seu novo melhor amigo.">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="shortcut icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <title>Cadastro - AdoPet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize.css/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/index.css">
  <link rel="stylesheet" href="./assets/css/cadastro/cadastro.css">
</head>

<body>
  <header class="cabecalho cabecalho--cadastro" role="banner">
    <div class="background__top" aria-hidden="true"></div>
    
    <nav class="cabecalho__nav" role="navigation" aria-label="Navegação principal">
      <ul class="cabecalho__lista">
        <li class="cabecalho__item cabecalho__logo">
          <a href="index.html" class="cabecalho__link" aria-label="AdoPet - Página inicial">
            <img src="./assets/img/Logo-768.png" alt="Logo AdoPet" width="168" height="44">
          </a>
        </li>
        <li class="cabecalho__item">
          <a href="index.html" class="cabecalho__link" aria-label="Página inicial">
            <img src="./assets/img/icon-home.svg" alt="Ícone casa" width="24" height="24">
          </a>
        </li>
        <li class="cabecalho__item">
          <a href="mensagem.html" class="cabecalho__link" aria-label="Mensagens">
            <img src="./assets/img/icon-mail.svg" alt="Ícone mensagem" width="24" height="24">
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="background__patas" aria-hidden="true"></div>
  </header>

  <div class="background__lateral" aria-hidden="true"></div>

  <main role="main">
    <section class="sessao-principal--cadastro">
      <div class="container-img">
        <img src="./assets/img/logo-azul-mobile.svg" alt="Logo AdoPet em azul" width="187" height="122">
      </div>

      <h1 class="sessao__titulo--cadastro">Ainda não tem cadastro?</h1>
      <p class="sessao__paragrafo">Então, antes de buscar seu melhor amigo, precisamos de alguns dados:</p>

      <div class="sessao-principal__formulario">
        <form action="" class="formulario__cadastro" id="formulario-cadastro" novalidate>
          <div class="formulario__campo">
            <label for="email" class="formulario__titulo">Email</label>
            <input 
              data-inputsCadastro 
              type="email" 
              id="email" 
              name="email"
              class="formulario__input"
              placeholder="Digite seu e-mail"
              autocomplete="email"
              required
              aria-describedby="email-error"
            >
            <span class="error" id="email-error" data-erro-email aria-live="polite"></span>
          </div>

          <div class="formulario__campo">
            <label for="nome" class="formulario__titulo">Nome</label>
            <input 
              data-inputsCadastro 
              type="text" 
              id="nome" 
              name="name"
              class="formulario__input"
              placeholder="Digite seu nome completo" 
              autocomplete="name"
              required
              aria-describedby="nome-error"
            >
            <span class="error" id="nome-error" data-erro-nome aria-live="polite"></span>
          </div>

          <div class="formulario__campo">
            <label for="senha" class="formulario__titulo">Senha</label>
            <input 
              data-inputsCadastro 
              type="password" 
              id="senha" 
              name="password"
              class="formulario__input formulario__input--senha"
              placeholder="Digite uma senha segura" 
              autocomplete="new-password"
              required
              aria-describedby="senha-error senha-help"
            >
            <div id="senha-help" class="formulario__ajuda">
              A senha deve ter pelo menos 8 caracteres
            </div>
            <span class="error" id="senha-error" data-erro-senha aria-live="polite"></span>
          </div>

          <div class="formulario__campo">
            <label for="senhaConfirm" class="formulario__titulo">Confirme a sua Senha</label>
            <input 
              data-inputsCadastro 
              type="password" 
              id="senhaConfirm"
              name="password-confirm"
              class="formulario__input formulario__input--senha" 
              placeholder="Confirme sua senha" 
              autocomplete="new-password"
              required
              aria-describedby="senha-confirm-error"
            >
            <span class="error" id="senha-confirm-error" data-erro-confirmaSenha aria-live="polite"></span>
          </div>

          <button type="submit" class="sessao__botao sessao__botao--cadastro">
            Cadastrar
          </button>
          
          <span class="error" data-senhaIncorreta aria-live="polite"></span>
        </form>

        <p class="cadastro__login">
          Já tem conta? 
          <a href="login.html" class="cadastro__link" aria-label="Fazer login na conta existente">Faça login aqui</a>
        </p>
      </div>
    </section>
    
    <div class="background__lateral--branco" aria-hidden="true"></div>
  </main>

  <footer class="footer--cadastro" role="contentinfo">
    <p class="footer__paragrafo">
      © 2024 - Desenvolvido por 
      <a class="footer__link" href="https://github.com/devguimaraes" target="_blank" rel="noopener noreferrer" aria-label="Perfil do desenvolvedor Bruno Guimarães no GitHub (abre em nova aba)">
        Bruno Guimarães
      </a>
    </p>
  </footer>

  <!-- Scripts otimizados -->
  <script type="module" src="./assets/js/performance.js"></script>
  <script type="module" src="./assets/js/cadastro.js"></script>
</body>

</html>
